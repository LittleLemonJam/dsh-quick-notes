name: Feature request
description: Suggest a new feature or an improvement.
title: '[Feature] '
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. You may write in English or 中文.

        Before submitting, please check the existing issues and read
        `docs/architecture.md` to see what the plugin intentionally does not do.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the use case or the pain point, not only the solution.
      placeholder: 'When I ... I have to ..., which is slow because ...'
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should the plugin do? Mockups or examples are welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or other plugins you tried.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Note directory
        - Editor and formatting
        - Window, compact mode and ball
        - Recycle bin
        - Settings and import/export
        - Persistence and storage
        - Documentation
        - Other
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched the existing issues for similar requests.
          required: true
        - label: This request fits the plugin's scope (a lightweight floating notes pad).
          required: true
